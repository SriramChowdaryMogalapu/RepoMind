# .github/workflows/ci.yml
name: RepoMind CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # ============================================================
  # Backend: Lint, Format, Tests & Evaluation
  # ============================================================
  backend-checks:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/repomind_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repomind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d repomind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ./backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      # ----------------------------------------------------------
      # Ruff
      # ----------------------------------------------------------
      # - name: Run Ruff lint check
      #   run: ruff check .

      # - name: Run Ruff format check
      #   run: ruff format --check .

      # ----------------------------------------------------------
      # Tests
      # ----------------------------------------------------------
      - name: Run Backend Unit & Integration Tests
        run: python -m pytest -v -s

      # ----------------------------------------------------------
      # RAG Evaluation
      # ----------------------------------------------------------
      - name: Run RAG Evaluation Benchmark
        run: python scripts/run_eval.py

  # ============================================================
  # Frontend: Install, Type Check & Build
  # ============================================================
  frontend-checks:
    name: Frontend Lint & Type Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  # ============================================================
  # Docker: Verify Backend & Frontend Images Build
  # ============================================================
  docker-build:
    name: Docker Builds Verification
    needs:
      - backend-checks
      - frontend-checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: repomind-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: repomind-frontend:test
