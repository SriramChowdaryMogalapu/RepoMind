[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "UP",
    "SIM",
    "RUF",
    "DTZ",
]

ignore = [
    # FastAPI dependency injection is intentionally used
    "B008",

    # Broad exception handling is intentional at service/provider
    # boundaries where fallback behavior is required.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E501",
    "RUF059",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
